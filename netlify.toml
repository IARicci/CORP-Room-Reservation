# Megawide Room Reservations - Netlify testing site (ready to publish, no build step).

[build]
  publish = "."

# Hash routes (#apps, #app-admin, ...) all live in index.html; send any other path there too.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
